services:
  db:
    image: postgres:16
    container_name: university_dev
    restart: always
    environment:
        POSTGRES_USER: user
        POSTGRES_PASSWORD: 1111
        POSTGRES_DB: university_db
    ports:
      - "5433:5432"
    volumes:
      - db_data:/var/lib/postgresql/data


volumes:
  db_data: