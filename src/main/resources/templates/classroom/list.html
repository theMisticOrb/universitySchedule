<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <title th:text="#{classroom.list.head.title}"></title>
</head>

<body>

    <div th:replace="fragments/header :: header"></div>
    <div th:replace="fragments/menu :: menu"></div>

    <h2 th:text="#{classroom.list.title}"></h2>

    <table border="1">
        <thead>
            <tr>
                <th th:text="#{classroom.list.table.name}"></th>
            </tr>
        </thead>
        <tbody>
            <tr th:each="classroom : ${classrooms}">
                <td th:text="${classroom.name}"></td>
            </tr>
        </tbody>

    </table>


</body>

</html>
