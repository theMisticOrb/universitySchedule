<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <title th:text="#{lesson.list.head.title}"></title>
</head>

<body>

    <div th:replace="fragments/header :: header"></div>
    <div th:replace="fragments/menu :: menu"></div>

    <h2 th:text="#{lesson.list.title}"></h2>

    <table border="1">
        <thead>
            <tr>
                <th th:text="#{lesson.list.table.day}"></th>
                <th th:text="#{lesson.list.table.hour}"></th>
                <th th:text="#{lesson.list.table.classroom}"></th>
                <th th:text="#{lesson.list.table.subject}"></th>
            </tr>
        </thead>
        <tbody>
            <tr th:each="lesson : ${lessons}">
                <td th:text="${lesson.weekDay}"></td>
                <td th:text="${lesson.classHour}"></td>
                <td th:text="${lesson.classroomName}"></td>
                <td th:text="${lesson.subjectId}"></td>
            </tr>
        </tbody>

    </table>


</body>

</html>
