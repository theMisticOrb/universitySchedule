<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
    <title th:text="#{admin.add.spec}">Add specialization</title>
    <meta name="_csrf" th:content="${_csrf.token}" />
    <meta name="_csrf_header" th:content="${_csrf.headerName}" />
</head>

<body>
    <div th:replace="fragments/header :: header"></div>
    <h2 th:text="#{admin.add.spec}">Add specialization</h2>

    <div>
        <input type="text" id="title" th:placeholder="#{admin.add.placeholder.specName}" />
        <input type="text" id="code" th:placeholder="#{admin.add.placeholder.specCode}" />
        <select id="DepartmentCode">
            <option value="" th:text="#{admin.add.spec.selectDepartment}">— Select Academic Department —</option>
            <option th:each="department : ${departments}" th:value="${department.code}"
                th:text="${department.title + ' (' + department.code + ')'}">
            </option>
        </select>
        <div id="form-error" style="color:red; display:none;"></div>
        <button type="button" onclick="addToList()" th:text="#{admin.add.toList}">+ Add to list</button>
    </div>

    <div id="preview" style="display:none;">
        <h3 th:text="#{admin.add.preview}">The following will be added:</h3>
        <ul id="item-list"></ul>
        <button type="button" onclick="saveAll()" th:text="#{admin.add.saveAll}">Save all</button>
        <div id="save-error" style="color:red; display:none;"></div>
    </div>

    <script th:inline="javascript">
        const items = [];

        function addToList() {
            const errorDiv = document.getElementById('form-error');
            errorDiv.style.display = 'none';

            const title = document.getElementById('title').value.trim();
            const code = document.getElementById('code').value.trim();
            const departmentCode = document.getElementById('departmentCode').value;

            if (!title || !code || !departmentCode) {
                errorDiv.textContent = '[[#{admin.add.script.fieldsError}]]';
                errorDiv.style.display = 'block';
                return;
            }

            items.push({title, code, departmentCode});

            const li = document.createElement('li');
            li.textContent = `${title} (${code}) — [[#{admin.add.spec.script.dep}]]: ${departmentCode}`;
            const removeBtn = document.createElement('button');
            removeBtn.textContent = '✕';
            removeBtn.onclick = () => {
                items.splice([...li.parentNode.children].indexOf(li), 1);
                li.remove();
                if (items.length === 0)
                    document.getElementById('preview').style.display = 'none';
            };
            li.appendChild(removeBtn);
            document.getElementById('item-list').appendChild(li);
            document.getElementById('preview').style.display = 'block';

            document.getElementById('title').value = '';
            document.getElementById('code').value = '';
            document.getElementById('departmentCode').value = '';
            document.getElementById('title').focus();
        }

        function saveAll() {
            const errorDiv = document.getElementById('save-error');

            const csrfToken = document.querySelector('meta[name="_csrf"]').content;
            const csrfHeader = document.querySelector('meta[name="_csrf_header"]').content;

            fetch('/admin/specializations/batch', {
                method: 'POST',
                headers: {'Content-Type': 'application/json', [csrfHeader]: csrfToken},
                body: JSON.stringify({list: items})
            })
                .then(res => res.json())
                .then(data => {
                    if (data.redirect) window.location.href = data.redirect;
                    else if (data.error) {errorDiv.textContent = data.error; errorDiv.style.display = 'block';}
                })
                .catch(() => {errorDiv.textContent = '[[#{admin.add.script.error}]]'; errorDiv.style.display = 'block';});
        }
    </script>
</body>

</html>
