<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head>
    <title>Edit user role</title>
</head>

<body>

    <div th:replace="fragments/header :: header"></div>

    <h2>Редактировать пользователя</h2>

    <p th:text="${user.firstName + ' ' + user.lastName}"></p>
    <p th:text="${user.email}"></p>

    <form th:action="@{/admin/users/{id}/edit/roles(id=${user.id})}" method="post">
        <label>Роли:</label>

        <div th:each="role : ${roles}">
            <input type="checkbox" name="roles" th:value="${role}" th:checked="${user.roles.contains(role)}" />
            <span th:text="${role}"></span>
        </div>

        <button type="submit">Сохранить</button>
    </form>
    <a th:href="@{/admin/users}">Назад</a>

</body>

</html>
