<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head>
    <title th:text="#{admin.useredit.head.title}"></title>
</head>

<body>

    <div th:replace="fragments/header :: header"></div>

    <h2 th:text="#{admin.useredit.title}"></h2>

    <p th:text="${user.firstName + ' ' + user.lastName}"></p>
    <p th:text="${user.email}"></p>

    <form th:action="@{/admin/users/{id}/edit/roles(id=${user.id})}" method="post">
        <label th:text="#{admin.useredit.form.roles}"></label>

        <div th:each="role : ${roles}">
            <input type="checkbox" name="roles" th:value="${role}" th:checked="${user.roles.contains(role)}" />
            <span th:text="${role}"></span>
        </div>

        <button type="submit" th:text="#{admin.useredit.button.save}"></button>
    </form>
    <a th:href="@{/admin/users}" th:text="#{admin.useredit.back}"></a>

</body>

</html>
