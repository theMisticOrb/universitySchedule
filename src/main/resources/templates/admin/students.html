<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head>
    <title th:text="#{admin.students.head.title}"></title>
</head>

<body>

    <div th:replace="fragments/header :: header"></div>

    <h2 th:text="#{admin.students.title}"></h2>

    <table border="1">
        <tr>
            <th th:text="#{admin.students.table.name}"></th>
            <th th:text="#{admin.students.table.group}"></th>
            <th th:text="#{admin.students.table.change}"></th>
        </tr>
        <tr th:each="student : ${students}">
            <td th:text="${student.firstName + ' ' + student.lastName}"></td>
            <td th:text="${student.group?.name}"></td>
            <td>
                <form th:action="@{/admin/students/{id}/group(id=${student.id})}" method="post">
                    <select name="groupId">
                        <option th:each="group : ${groups}" th:value="${group.id}" th:text="${group.name}"
                            th:selected="${group.id == student.group?.id}">
                        </option>
                    </select>
                    <button type="submit" th:text="#{admin.students.button.setgroup}">Назначить</button>
                </form>
            </td>
        </tr>
    </table>

</body>

</html>
