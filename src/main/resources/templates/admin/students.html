<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head>
    <title>Change student group</title>
</head>

<body>

    <div th:replace="fragments/header :: header"></div>

    <h2>Студенты</h2>

    <table>
        <tr>
            <th>Имя</th>
            <th>Текущая группа</th>
            <th>Изменить группу</th>
        </tr>
        <tr th:each="student : ${students}">
            <td th:text="${student.firstName + ' ' + student.lastName}"></td>
            <td th:text="${student.group?.name}"></td>
            <td>
                <form th:action="@{/admin/students/{id}/group(id=${student.id})}" method="post">
                    <select name="groupId">
                        <option th:each="group : ${groups}" th:value="${group.id}" th:text="${group.name}"
                            th:selected="${group.id == student.group?.id}">
                        </option>
                    </select>
                    <button type="submit">Назначить</button>
                </form>
            </td>
        </tr>
    </table>

</body>

</html>
