<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head>
    <title th:text="#{admin.dashboard.users.addusers}">Add users</title>
</head>

<body>
    <h2>Активация аккаунта</h2>
    <p>Подтвердите email и задайте пароль для входа в систему.</p>

    <div th:if="${error}" style="color:red;" th:text="${error}"></div>

    <form th:action="@{/activation(tokenValue=${token})}" th:object="${request}" method="post">

        <div>
            <label>Email</label>
            <input type="email" th:field="*{email}" />
            <span th:if="${#fields.hasErrors('email')}" th:errors="*{email}" style="color:red;">
            </span>
        </div>

        <div>
            <label>Пароль</label>
            <input type="password" th:field="*{password}" />
            <span th:if="${#fields.hasErrors('password')}" th:errors="*{password}" style="color:red;">
            </span>
        </div>

        <div>
            <label>Подтвердите пароль</label>
            <input type="password" th:field="*{confirmPassword}" />
            <span th:if="${#fields.hasErrors('confirmPassword')}" th:errors="*{confirmPassword}" style="color:red;">
            </span>
        </div>

        <button type="submit">Активировать аккаунт</button>
    </form>


</body>

</html>
