<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">

<head>
    <title th:text="#{admin.dashboard.head.title}"></title>
</head>

<body>

    <div th:replace="fragments/header :: header"></div>

    <h2 th:text="#{admin.dashboard.adminpanel}">Admin panel</h2>
    <div>
        <div>
            <span th:text="#{admin.dashboard.students}"></span><span th:text="${totalStudents}"></span>
        </div>
        <div>
            <span th:text="#{admin.dashboard.teachers}"></span><span th:text="${totalTeachers}"></span>
        </div>
        <div>
            <span th:text="#{admin.dashboard.users}"></span><span th:text="${totalUsers}"></span>
        </div>
    </div>
    <nav>
        <a th:href="@{/admin/users}" th:text="#{admin.dashboard.users.management}"></a><br>
        <a th:href="@{/admin/students}" th:text="#{admin.dashboard.students.management}"></a><br>
        <a th:href="@{/admin/teachers}" th:text="#{admin.dashboard.teachers.management}"></a>
    </nav>

</body>

</html>
