<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
    <title>Додати заняття</title>
</head>

<body>
    <div th:replace="fragments/header :: header"></div>
    <h2>Додати заняття</h2>

    <div th:if="${error}" style="color:red;" th:text="${error}"></div>

    <form th:action="@{/teacher/schedule/add}" method="post">

        <div>
            <label>Предмет</label>
            <select name="subjectTitle">
                <option value="">— Оберіть предмет —</option>
                <option th:each="subject : ${subjects}" th:value="${subject.title}" th:text="${subject.title}">
                </option>
            </select>
        </div>

        <div>
            <label>День тижня</label>
            <select name="weekDay">
                <option value="">— Оберіть день —</option>
                <option th:each="day : ${weekDays}" th:value="${day}" th:text="${day}">
                </option>
            </select>
        </div>

        <div>
            <label>Пара</label>
            <select name="classHour">
                <option value="">— Оберіть пару —</option>
                <option th:each="hour : ${classHours}" th:value="${hour}" th:text="${hour.start} + ' - ' + ${hour.end}">
                </option>
            </select>
        </div>

        <div>
            <label>Аудиторія</label>
            <select name="classroomName">
                <option value="">— Оберіть аудиторію —</option>
                <option th:each="classroom : ${classrooms}" th:value="${classroom.name}" th:text="${classroom.name}">
                </option>
            </select>
        </div>

        <div>
            <label>Група</label>
            <select name="groupName">
                <option value="">— Оберіть групу —</option>
                <option th:each="group : ${groups}" th:value="${group.name}" th:text="${group.name}">
                </option>
            </select>
        </div>

        <button type="submit">Зберегти</button>
        <a th:href="@{/teacher/schedule}">Скасувати</a>
    </form>
</body>

</html>
