<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <title th:text="#{teacher.list.head.title}"></title>
</head>

<body>

    <div th:replace="fragments/header :: header"></div>
    <div th:replace="fragments/menu :: menu"></div>

    <h2 th:text="#{teacher.list.title}"></h2>

    <table border="1">
        <thead>
            <tr>
                <th th:text="#{teacher.list.table.departmentcode}"></th>
                <th th:text="#{teacher.list.table.firstname}"></th>
                <th th:text="#{teacher.list.table.middlename}"></th>
                <th th:text="#{teacher.list.table.lastname}"></th>
            </tr>
        </thead>
        <tbody>
            <tr th:each="teacher : ${teachers}">
                <td th:text="${teacher.departmentCode}"></td>
                <td th:text="${teacher.firstName}"></td>
                <td th:text="${teacher.middleName}"></td>
                <td th:text="${teacher.lastName}"></td>
            </tr>
        </tbody>

    </table>


</body>

</html>
