<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">

<header th:fragment="header">
    <nav>
        <span>University Schedule</span>
    </nav>
    <div sec:authorize="isAuthenticated()">
        <span sec:authentication="name"></span>
        <a sec:authorize="hasRole('ADMIN')" th:href="@{/admin/dashboard}">
            Админ панель
        </a>
        <a sec:authorize="hasRole('TEACHER')" th:href="@{/teacher/dashboard}">
            Мой кабинет
        </a>
        <a sec:authorize="hasRole('STUDENT')" th:href="@{/student/dashboard}">
            Мой кабинет
        </a>
        <form th:action="@{/logout}" method="post">
            <button type="submit">Выйти</button>
        </form>
    </div>

    <div sec:authorize="!isAuthenticated()">
        <a th:href="@{/login}">Войти</a>
        <a th:href="@{/register}">Регистрация</a>
    </div>
</header>

</htmllang="en">
