<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
    <title th:text="#{auth.forgot.title}"></title>
</head>

<body>
    <h2 th:text="#{auth.forgot.title}">Forgot your password?</h2>
    <p th:text="#{auth.forgot.message}">Enter your email address—we'll send you a link to reset your password.</p>

    <div th:if="${error}" style="color:red;" th:text="${error}"></div>

    <form th:action="@{/forgot-password}" th:object="${request}" method="post">
        <label th:text="#{auth.login.email}">Email</label>
        <input type="email" th:field="*{email}" />
        <span th:if="${#fields.hasErrors('email')}" th:errors="*{email}" style="color:red;"></span>
        <button type="submit" th:text="#{auth.forgot.button}">Надіслати</button>
    </form>

    <a th:href="@{/login}" th:text="#{auth.forgot.back}">Return to login</a>
</body>

</html>
