<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head>
    <title th:text="#{admin.activation}">Account Activation</title>
</head>

<body>
    <h2 th:text="#{admin.activation}">Account Activation</h2>
    <p th:text="#{admin.activation.message}">Confirm your email address and set a password to log in.</p>

    <div th:if="${error}" style="color:red;" th:text="${error}"></div>

    <form th:action="@{/activation(tokenValue=${token})}" th:object="${request}" method="post">

        <div>
            <label th:text="#{admin.activation.email}">Email</label>
            <input type="email" th:field="*{email}" required/>
            <span th:if="${#fields.hasErrors('email')}" th:errors="*{email}" style="color:red;">
            </span>
        </div>

        <div>
            <label th:text="#{admin.activation.password}">Password</label>
            <input type="password" th:field="*{password}" minlength="8" required/>
            <span th:if="${#fields.hasErrors('password')}" th:errors="*{password}" style="color:red;">
            </span>
        </div>

        <div>
            <label th:text="#{admin.activation.confirm}">Confirm your password</label>
            <input type="password" th:field="*{confirmPassword}" />
            <span th:if="${#fields.hasErrors('confirmPassword')}" th:errors="*{confirmPassword}" style="color:red;">
            </span>
        </div>

        <button type="submit" th:text="#{admin.activation.activate}">Activate account</button>
    </form>


</body>

</html>
