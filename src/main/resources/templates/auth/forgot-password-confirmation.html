<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
    <title th:text="#{auth.forgot.confirmation.title}"></title>
</head>

<body>
    <h2 th:text="#{auth.forgot.confirmation.title}">The letter has been sent</h2>
    <p th:text="#{auth.forgot.confirmation.message}">
        Check your email and click the link to reset your password.
    </p>
    <a th:href="@{/login}" th:text="#{auth.forgot.back}">Return to login</a>
</body>

</html>
