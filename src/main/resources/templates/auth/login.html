<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head>
    <title th:text="#{auth.login.head.title}"></title>
</head>

<body>

    <div th:replace="fragments/header :: header"></div>

    <h2 th:text="#{auth.login.title}"></h2>

    <div th:if="${param.error}" th:text="#{auth.login.errorlogin}">
    </div>

    <div th:if="${param.logout}" th:text="#{auth.login.logout}">
    </div>

    <form th:action="@{/login}" method="post">

        <label th:text="#{auth.login.email}"></label>
        <input type="email" name="username" placeholder="email@school.com" />

        <label th:text="#{auth.login.password}"></label>
        <input type="password" name="password" />

        <button type="submit" th:text="#{auth.login.button.login}"></button>

    </form>

</body>

</html>
