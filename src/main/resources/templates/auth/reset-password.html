<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
    <title th:text="#{auth.reset.title}"></title>
</head>

<body>
    <h2 th:text="#{auth.reset.title}">Reset Password</h2>

    <div th:if="${error}" style="color:red;" th:text="${error}"></div>

    <form th:action="@{/forgot-password/reset(tokenValue=${token})}" th:object="${request}" method="post">

        <div>
            <label th:text="#{admin.activation.password}">New Password</label>
            <input type="password" th:field="*{password}" />
            <span th:if="${#fields.hasErrors('password')}" th:errors="*{password}" style="color:red;"></span>
        </div>

        <div>
            <label th:text="#{admin.activation.confirm}">Confirm your password</label>
            <input type="password" th:field="*{confirmPassword}" />
            <span th:if="${#fields.hasErrors('confirmPassword')}" th:errors="*{confirmPassword}"
                style="color:red;"></span>
        </div>

        <button type="submit" th:text="#{auth.reset.button}">Save password</button>
    </form>
</body>

</html>
