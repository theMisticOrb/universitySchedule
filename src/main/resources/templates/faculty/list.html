<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <title>Faculties</title>
</head>

<body>

    <div th:replace="fragments/header :: header"></div>
    <div th:replace="fragments/menu :: menu"></div>

    <h2> All Faculties Of University</h2>

    <table border="1">
        <thead>
            <tr>
                <th>Faculty Code</th>
                <th>Title</th>
            </tr>
        </thead>
        <tbody>
            <tr th:each="faculty : ${faculties}">
                <td th:text="${faculty.code}"></td>
                <td th:text="${faculty.title}"></td>
            </tr>
        </tbody>

    </table>


</body>

</html>
