<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <title th:text="#{student.list.head.title}"></title>
</head>

<body>

    <div th:replace="fragments/header :: header"></div>
    <div th:replace="fragments/menu :: menu"></div>

    <h2 th:text="#{student.list.title}"></h2>

    <table border="1">
        <thead>
            <tr>
                <th th:text="#{student.list.table.group}"></th>
                <th th:text="#{student.list.table.firstname}"></th>
                <th th:text="#{student.list.table.middlename}"></th>
                <th th:text="#{student.list.table.lastname}"></th>
            </tr>
        </thead>
        <tbody>
            <tr th:each="student : ${students}">
                <td th:text="${student.groupName}"></td>
                <td th:text="${student.firstName}"></td>
                <td th:text="${student.middleName}"></td>
                <td th:text="${student.lastName}"></td>
            </tr>
        </tbody>

    </table>


</body>

</html>
