<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <title th:text="#{specialization.list.head.title}"></title>
</head>

<body>

    <div th:replace="fragments/header :: header"></div>
    <div th:replace="fragments/menu :: menu"></div>

    <h2 th:text="#{specialization.list.title}"></h2>

    <table border="1">
        <thead>
            <tr>
                <th th:text="#{specialization.list.table.code}"></th>
                <th th:text="#{specialization.list.table.title}"></th>
            </tr>
        </thead>
        <tbody>
            <tr th:each="specialization : ${specializations}">
                <td th:text="${specialization.departmentCode}"></td>
                <td th:text="${specialization.title}"></td>
            </tr>
        </tbody>

    </table>


</body>

</html>
