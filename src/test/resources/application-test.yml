spring:
  config:
    activate:
      on-profile: test
    datasource:
    driver-class-name: org.testcontainers.jdbc.ContainerDatabaseDriver
    url: jdbc:tc:postgresql:14.6:///test?&TC_REUSABLE=true
    username: root
    password: test
    hikari:
      minimum-idle: 1
      maximum-pool-size: 5
  jpa:
    show-sql: true
    properties:
      hibernate:
        format_sql: true
      
  flyway:
    enabled: true

  logging:
    level:
    net.ttddyy.dsproxy: DEBUG
    net.ttddyy.dsproxy.listener: DEBUG